version: 0.6.0
kind: app
app:
  name: 复星差旅对话管家
  mode: advanced-chat
  icon: 🤖
  icon_type: emoji
  icon_background: '#FFF3E0'
  description: 方案B：对话后移——NLU/多轮编排/知识库RAG/工具调度（Dify 编排，后端工具接口取数）
  use_icon_as_answer_icon: false
workflow:
  graph:
    nodes:
    - id: start_node
      type: custom
      data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: user_id
          label: 用户ID
          type: text-input
          required: true
          options: []
          value_selector: []
        - variable: role
          label: 角色
          type: text-input
          required: false
          options: []
          value_selector: []
        - variable: level
          label: 职级
          type: text-input
          required: false
          options: []
          value_selector: []
        - variable: user_name
          label: 姓名
          type: text-input
          required: false
          options: []
          value_selector: []
        - variable: tool_data
          label: 系统数据
          type: text-input
          required: false
          options: []
          value_selector: []
      position:
        x: 79.0
        y: 282.0
      positionAbsolute:
        x: 79.0
        y: 282.0
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: llm_understand
      type: custom
      data:
        type: llm
        title: LLM-理解
        desc: ''
        selected: false
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-v4-flash
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: '你是复星差旅 AI 管家，负责差旅对话的意图识别与槽位抽取。必须结合历史对话理解省略句、指代与追问（例如用户先问"差旅政策"，再追问"M5级别的呢"，应识别为
            policy_query 且 level=M5）。

            意图枚举（priority 数字越小优先级越高）： - personal_booking(1)：无差旅单/个人支付，如"不用出差单""个人付"
            - cancel_adjust(2)：取消/调整，如"取消""退订""改签" - flight_book(3)：机票预订 - hotel_book(3)：酒店预订
            - combo_book(3)：机票+酒店组合 - trip_query(4)：行程查询 - policy_query(5)：差旅政策/差标/标准/报销
            - chitchat(6)：闲聊 - unknown(7)：无法识别

            槽位字段（无法确定一律空字符串）： - date：YYYY-MM-DD，支持"8月20日""8.20""8/20"等中文数字表达 - origin/destination：出发/到达城市
            - city：酒店目的城市 - level：职级序列（M/P/I + 数字，如 M5、P13、M3/P9）；仅在用户明确提及职级时填写（如"M5级别的呢""P6的标准"），当前用户职级只作上下文、不自动填入槽位
            - queryTarget：me / subordinate / leader - tripId / flightNo / hotelId
            / orderId：业务对象标识 - overBudgetReason：official（因公超标）/ personal（因私超标）

            行为规则： 1. 用户确认选择（"选1号航班""就选第一个""确认预订""确认支付"）时，结合最近展示的航班/酒店/订单，把所选对象填入对应槽位（flightNo/hotelId/orderId），intent
            用当前预订意图。 2. 回答超标确认（"因公""因私""A"）时填 overBudgetReason。 3. 缺失关键信息（订票缺日期/路线，订酒店缺城市）时
            need_ask=true，并在 reply 中给出追问。 4. 秘书代订场景：用户在预订流程中说"帮领导订"等，填 queryTarget=leader。
            5. 只输出 JSON，不要 markdown 代码块：{"intent":"...","slots":{...},"reply":"...","need_ask":true/false}
            6. reply 仅在纯对话/追问/闲聊场景给出（工具取数场景留空）。

            当前用户：{{#start_node.user_name#}}（职级 {{#start_node.level#}}，角色 {{#start_node.role#}}）
            用户输入：{{#sys.query#}} （历史对话由记忆自动注入，务必结合上下文理解本次输入）\n\n系统数据（后端工具取数后注入，可能为空）：\n{{#start_node.tool_data#}}\n\n规则：若系统数据非空，则基于其中的航班/酒店/差标/行程/订单/取消结果数据生成最终回复与推荐（列表用数字编号），intent
            保持当前预订意图，reply 填充完整回复文本，need_ask=false；若系统数据为空且是取数场景，need_ask=false、reply
            留空，由后端取数后重新调用。'
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: true
          window:
            enabled: true
            size: 12
        context:
          enabled: false
          variable_selector: []
        structured_output:
