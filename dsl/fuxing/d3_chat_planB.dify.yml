        - variable: orderId
          label: orderId
          type: text-input
          required: false
          options: []
          value_selector:
          - code_parse
          - orderId
        outputs:
          route:
            type: string
            children: null
        code: "def main(intent: str, orderId: str) -> dict:\n    intent = (intent\
          \ or \"unknown\").strip()\n    if intent in (\"flight_book\", \"combo_book\"\
          ):\n        route = \"flight\"\n    elif intent == \"hotel_book\":\n   \
          \     route = \"hotel\"\n    elif intent == \"trip_query\":\n        route\
          \ = \"trip\"\n    elif intent == \"cancel_adjust\":\n        route = \"\
          cancel\" if (orderId or \"\").strip() else \"trip\"\n    elif intent ==\
          \ \"policy_query\":\n        route = \"policy\"\n    elif intent in (\"\
          booking_confirm\", \"confirm_pay\"):\n        route = \"book\"\n    elif\
          \ intent == \"personal_booking\":\n        route = \"hotel\"\n    else:\n\
          \        route = \"chat\"\n    return {\"route\": route}"
        code_language: python3
      position:
        x: 980.0
