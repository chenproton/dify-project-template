    - id: code_parse
      type: custom
      data:
        type: code
        title: 代码-解析
        desc: ''
        selected: false
        variables:
        - variable: raw
          label: raw
          type: text-input
          required: true
          options: []
          value_selector:
          - llm_understand
          - text
        code: "import json, re\n\ndef main(raw: str) -> dict:\n    text = (raw or \"\").strip()\n    text = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.DOTALL)\n    m = re.search(r\"\\{.*\\}\", text, re.DOTALL)\n    data = None\n    if m:\n        try:\n            data = json.loads(m.group(0))\n        except Exception:\n            data = None\n    if not isinstance(data, dict):\n        data = {}\n    intent = str(data.get(\"intent\", \"unknown\") or \"unknown\")\n    slots = data.get(\"slots\", {}) or {}\n    if not isinstance(slots, dict):\n        slots = {}\n    def g(k):\n        v = slots.get(k, \"\")\n        return str(v).strip() if v else \"\"\n    return {\n        \"intent\": intent,\n        \"date\": g(\"date\"), \"origin\": g(\"origin\"), \"destination\": g(\"destination\"),\n        \"city\": g(\"city\"), \"level\": g(\"level\"), \"queryTarget\": g(\"queryTarget\"),\n        \"tripId\": g(\"tripId\"), \"flightNo\": g(\"flightNo\"), \"hotelId\": g(\"hotelId\"),\n        \"orderId\": g(\"orderId\"), \"overBudgetReason\": g(\"overBudgetReason\"),\n        \"reply\": str(data.get(\"reply\", \"\") or \"\").strip(),\n        \"need_ask\": bool(data.get(\"need_ask\", False)),\n    }"
        code_language: python3
        outputs:
          intent: {type: string, children: null}
          date: {type: string, children: null}
          origin: {type: string, children: null}
          destination: {type: string, children: null}
          city: {type: string, children: null}
          level: {type: string, children: null}
          queryTarget: {type: string, children: null}
          tripId: {type: string, children: null}
          flightNo: {type: string, children: null}
          hotelId: {type: string, children: null}
          orderId: {type: string, children: null}
          overBudgetReason: {type: string, children: null}
          reply: {type: string, children: null}
          need_ask: {type: boolean, children: null}
